<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Neon OS Linux-distro desktop wallpaper</title>
  <desc id="desc">A crisp dark graphite desktop wallpaper with angular green circuit geometry, a sharp Neon OS shield emblem, and restrained distribution branding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#030605"/><stop offset=".52" stop-color="#08120c"/><stop offset="1" stop-color="#020403"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c2ffa9"/><stop offset=".5" stop-color="#39ff14"/><stop offset="1" stop-color="#00b84a"/>
    </linearGradient>
    <radialGradient id="ambient" cx="68%" cy="46%" r="55%">
      <stop stop-color="#1cff54" stop-opacity=".15"/><stop offset="1" stop-color="#06100a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#66ff78" stroke-width="1" opacity=".045"/>
    </pattern>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="45"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#ambient)"/>
  <g fill="none" stroke="#39ff14" stroke-width="2" opacity=".2">
    <path d="M0 166h275l105 105h130M0 190h257l91 91h132M0 914h310l110-110h110M0 940h286l94-94h150"/>
    <path d="M1920 132h-260l-110 110h-143M1920 158h-238l-90 90h-150M1920 894h-280l-118-118h-116M1920 922h-256l-92-92h-166"/>
    <path d="M286 0v118l76 76v93M312 0v104l58 58v112M1612 0v112l-82 82v90M1640 0v98l-58 58v128"/>
    <path d="M312 1080V950l78-78v-82M338 1080V964l58-58v-96M1590 1080V946l-76-76v-80M1616 1080V960l-58-58v-94"/>
  </g>
  <g fill="#a4ff8b" opacity=".72">
    <rect x="497" y="266" width="7" height="7"/><rect x="509" y="266" width="7" height="7"/>
    <rect x="1402" y="236" width="7" height="7"/><rect x="1414" y="236" width="7" height="7"/>
    <rect x="522" y="800" width="7" height="7"/><rect x="534" y="800" width="7" height="7"/>
    <rect x="1370" y="766" width="7" height="7"/><rect x="1382" y="766" width="7" height="7"/>
  </g>
  <ellipse cx="1270" cy="520" rx="380" ry="350" fill="#39ff14" opacity=".08" filter="url(#blur)"/>
  <g transform="translate(1000 232)">
    <path d="M250 0 464 123v246L250 492 36 369V123L250 0Z" fill="#06100a" stroke="#1c6732" stroke-width="2"/>
    <path d="M250 28 440 138v218L250 466 60 356V138L250 28Z" fill="none" stroke="url(#green)" stroke-width="8" stroke-linejoin="miter" filter="url(#glow)"/>
    <path d="M144 360V144h48l116 137V144h48v216h-47L192 222v138h-48Z" fill="url(#green)"/>
  </g>
  <g transform="translate(160 330)">
    <path d="M0 0h8v116h-8z" fill="#39ff14"/>
    <text x="34" y="38" fill="#baffaa" font-family="monospace, sans-serif" font-size="18" font-weight="700" letter-spacing="5">NEON OS</text>
    <text x="34" y="82" fill="#8bac91" font-family="monospace, sans-serif" font-size="38" font-weight="700" letter-spacing="1">SECURE. OPEN. YOURS.</text>
    <text x="34" y="126" fill="#5b8064" font-family="monospace, sans-serif" font-size="16" letter-spacing="3">A LINUX-INSPIRED SYSTEM PROJECT</text>
  </g>
  <text x="166" y="1008" fill="#5c8d67" font-family="monospace, sans-serif" font-size="14" letter-spacing="2" opacity=".7">NEON OS / DESKTOP EDITION</text>
  <path d="M0 1058h1920" stroke="#39ff14" stroke-width="2" opacity=".26"/>
</svg>
