<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Neon OS desktop wallpaper</title>
  <desc id="desc">A dark graphite wallpaper with a luminous green circular Neon OS emblem, subtle circuit lines, and a restrained terminal-inspired atmosphere.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030706"/>
      <stop offset=".52" stop-color="#07110c"/>
      <stop offset="1" stop-color="#020504"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="47%" r="48%">
      <stop offset="0" stop-color="#1aff4d" stop-opacity=".2"/>
      <stop offset=".48" stop-color="#0c6b2b" stop-opacity=".1"/>
      <stop offset="1" stop-color="#020504" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2ffae"/>
      <stop offset=".5" stop-color="#39ff14"/>
      <stop offset="1" stop-color="#00bf55"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#43ff6b" stroke-width="1" opacity=".045"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="56"/>
    </filter>
    <radialGradient id="vignette">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".72"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#halo)"/>
  <g fill="none" stroke="#35ff60" stroke-width="2" opacity=".17">
    <path d="M0 248h210l60 60h142M0 268h193l60 60h116M1920 212h-188l-74 74h-130M1920 236h-174l-64 64h-112"/>
    <path d="M0 790h250l76-76h174M0 818h220l74-74h128M1920 760h-270l-80 80h-164M1920 788h-240l-62 62h-136"/>
    <path d="M338 0v118l58 58v82M366 0v102l48 48v92M1572 0v126l-70 70v66M1602 0v112l-52 52v98"/>
    <path d="M420 1080V960l68-68v-72M448 1080V974l48-48v-80M1516 1080V946l-66-66v-66M1544 1080V960l-48-48v-78"/>
  </g>
  <g fill="#55ff70" opacity=".55">
    <circle cx="412" cy="366" r="3"/><circle cx="1564" cy="376" r="3"/><circle cx="500" cy="820" r="3"/><circle cx="1428" cy="800" r="3"/>
    <circle cx="396" cy="258" r="2"/><circle cx="1528" cy="266" r="2"/><circle cx="488" cy="890" r="2"/><circle cx="1450" cy="880" r="2"/>
  </g>
  <circle cx="960" cy="488" r="300" fill="#39ff14" opacity=".08" filter="url(#soft)"/>
  <circle cx="960" cy="472" r="247" fill="none" stroke="#39ff14" stroke-width="2" opacity=".18"/>
  <circle cx="960" cy="472" r="221" fill="none" stroke="url(#neon)" stroke-width="8" filter="url(#glow)"/>
  <circle cx="960" cy="472" r="196" fill="none" stroke="#83ff69" stroke-width="2" opacity=".45"/>
  <path d="M861 572V372h48l110 139V372h50v200h-47L911 431v141z" fill="url(#neon)" filter="url(#glow)"/>
  <path d="M960 233v-24M960 735v-24M721 472h-24M1223 472h-24" stroke="#a5ff8b" stroke-width="5" stroke-linecap="round" opacity=".9"/>
  <text x="960" y="792" fill="#b1ff9d" font-family="monospace, sans-serif" font-size="48" font-weight="700" letter-spacing="16" text-anchor="middle">NEON OS</text>
  <text x="960" y="840" fill="#5aa96c" font-family="monospace, sans-serif" font-size="17" letter-spacing="5" text-anchor="middle">DARK BY DESIGN · BRIGHT BY NATURE</text>
  <text x="72" y="1008" fill="#62c77a" opacity=".46" font-family="monospace, sans-serif" font-size="15" letter-spacing="2">NEON OS / DESKTOP CONCEPT</text>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
