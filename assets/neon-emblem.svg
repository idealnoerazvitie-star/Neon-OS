<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Neon OS distro emblem</title>
  <desc id="desc">Angular neon-green N inside a sharp circular shield, on a dark Linux-distro-style background.</desc>
  <defs>
    <linearGradient id="metal" x1="70" y1="70" x2="440" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b9ff9c"/>
      <stop offset=".48" stop-color="#39ff14"/>
      <stop offset="1" stop-color="#00b84a"/>
    </linearGradient>
    <radialGradient id="back" cx="50%" cy="42%" r="72%">
      <stop stop-color="#102019"/>
      <stop offset="1" stop-color="#030605"/>
    </radialGradient>
    <filter id="neon-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="86" fill="url(#back)"/>
  <path d="M256 49 424 145v190L256 431 88 335V145L256 49Z" fill="#07120b" stroke="#1c6732" stroke-width="2"/>
  <path d="M256 69 406 155v170l-150 86-150-86V155L256 69Z" fill="none" stroke="url(#metal)" stroke-width="9" stroke-linejoin="miter" filter="url(#neon-glow)"/>
  <path d="M172 329V183h42l84 99V183h42v146h-41l-85-99v99h-42Z" fill="url(#metal)"/>
  <path d="M173 169h53M286 343h55M127 256h22M363 256h22" stroke="#93ff78" stroke-width="4" stroke-linecap="square" opacity=".8"/>
  <path d="M102 143h44M366 369h44M102 369h44M366 143h44" stroke="#39ff14" stroke-width="2" opacity=".45"/>
  <text x="256" y="476" fill="#b9ff9c" font-family="monospace, sans-serif" font-size="21" font-weight="700" letter-spacing="7" text-anchor="middle">NEON OS</text>
</svg>
